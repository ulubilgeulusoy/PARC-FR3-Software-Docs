site_name: PARC FR3 Software Documentation
site_description: Central documentation for FR3 robot software, experiment GUIs, setup, and operations.
site_author: PARC / Arquilla Research Group
repo_name: ulubilgeulusoy/PARC-FR3-Software-Docs
repo_url: https://github.com/ulubilgeulusoy/PARC-FR3-Software-Docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Sections:
          - Overview: getting-started/overview.md
          - Repository Map: getting-started/repository-map.md
          - Quick Start: getting-started/quick-start.md
          - ROS2 ViSP libfranka 101: getting-started/architecture/ros2-visp-libfranka-101.md
          - System Data Flow: getting-started/architecture/system-data-flow.md
          - ROS2 vs LSL: getting-started/architecture/ros2-vs-lsl.md
          - Safety and Operating Notes: getting-started/safety-and-operating-notes.md
  - FR3 Control System Installation Guide:
      - Sections:
          - Summary: installation-guide/summary.md
          - Before Installation: installation-guide/before-installation.md
          - Recommended Installation Steps: installation-guide/recommended-installation-steps.md
          - Lessons Learned: installation-guide/lessons-learned.md
  - FR3 User Guide:
      - Sections:
          - FR3 User Guide Summary: user-guide/summary/fr3-user-guide-summary.md
          - Workspaces:
              - Franka Workspace Guide: user-guide/workspaces/franka-workspace-guide.md
              - Baseline vs Jointfailsafe: user-guide/workspaces/baseline-vs-jointfailsafe.md
              - Build Source Runtime Rules: user-guide/workspaces/build-source-runtime-rules.md
          - Repositories:
              - franka_kinesthetic_teaching_GUI: user-guide/repositories/franka-kinesthetic-teaching-gui.md
              - FR3_control_GUI: user-guide/repositories/fr3-control-gui.md
              - FR3_visual_servo_examples: user-guide/repositories/fr3-visual-servo-examples.md
              - franka_ws_jointfailsafe: user-guide/repositories/franka-ws-jointfailsafe.md
              - Investment-HRI-Experiment-Task-GUIs: user-guide/repositories/investment-hri-experiment-task-guis.md
              - Event_marker_LSL_GUI: user-guide/repositories/event-marker-lsl-gui.md
          - Operations:
              - Standard Workflows: user-guide/operations/standard-workflows.md
              - Troubleshooting: user-guide/operations/troubleshooting.md
              - Known Limitations: user-guide/operations/known-limitations.md
          - API References:
              - Overview: user-guide/api-references/overview.md
              - C++ Doxygen Links: user-guide/api-references/cpp-doxygen-links.md
              - Python API Plan: user-guide/api-references/python-api-plan.md
