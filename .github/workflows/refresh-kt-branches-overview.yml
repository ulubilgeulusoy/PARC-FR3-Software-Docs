name: Build and Deploy Docs (Auto Branch Overview)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Generate Branches Overviews
        run: |
          python scripts/generate_kt_branches_overview.py
          python scripts/generate_vs_branches_overview.py

      - name: Commit generated content if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/user-guide/fr3-example-capabilities/kinesthetic-teaching/branches-overview.md
          git add docs/user-guide/fr3-example-capabilities/visual-servoing/branches-overview.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: refresh branch overviews"
            git push
          fi

      - name: Build site
        run: mkdocs build --clean

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
