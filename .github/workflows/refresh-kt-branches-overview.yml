name: Refresh Kinesthetic Branch Overview

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
  push:
    branches:
      - main
    paths:
      - scripts/generate_kt_branches_overview.py

permissions:
  contents: write

jobs:
  refresh-branches-overview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Branches Overview
        run: python scripts/generate_kt_branches_overview.py

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/user-guide/fr3-example-capabilities/kinesthetic-teaching/branches-overview.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: refresh kinesthetic branches overview"
            git push
          fi
